[log_config]
version = 1

[handlers]
keys = default, access

[formatters]
keys = generic, access

[logger_root]
level = INFO
handlers = default

[logger_uvicorn]
level = INFO
handlers = default
propagate = 0

[logger_uvicorn.access]
level = INFO
handlers = access
propagate = 0

[handler_default]
class = StreamHandler
formatter = generic
args = (sys.stdout,)

[handler_access]
class = StreamHandler
formatter = access
args = (sys.stdout,)

[formatter_generic]
format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[formatter_access]
format = %(asctime)s | ACCESS | %(client_addr)s - "%(request_line)s" %(status_code)s
datefmt = %Y-%m-%d %H:%M:%S
