services:
  mediastack:
    image: mediastack-nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/usr/local/nginx/conf/nginx.conf:ro
      - ./data/videos:/data/videos:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  mediastack-Server:
    image: mediastack-backend:latest
    volumes:
      - ./backend:/app:ro
      - ./data:/app/data
    environment:
      - DEBUG=false
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:///./data/db/mediastack.db
      - STORAGE_PATH=/app/data/videos
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    restart: unless-stopped
