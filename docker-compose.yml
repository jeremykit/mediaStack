services:
  mediastack:
    image: mediastack-nginx:latest
    expose:
      - 80
    volumes:
      - ./nginx/nginx.conf:/usr/local/nginx/conf/nginx.conf:ro
      - ./data/videos:/data/videos:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - mediastack-server
    restart: unless-stopped
    networks:
      - jitsi-docker-jitsi-meet_meet.jitsi

  mediastack-server:
    image: mediastack-backend:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
    expose:
      - 8000
    volumes:
      - ./backend:/app:ro
      - ./data:/app/data
    environment:
      - DEBUG=false
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:///./data/db/mediastack.db
      - STORAGE_PATH=/app/data/videos
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    restart: unless-stopped
    networks:
      - jitsi-docker-jitsi-meet_meet.jitsi


networks:
  jitsi-docker-jitsi-meet_meet.jitsi:
    external: true # 关键：声明使用已存在的外部网络
